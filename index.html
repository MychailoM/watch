<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watches</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">
</head>

<body>
    <video class="video" width="100%" autoplay muted loop playsinline>
        <source src="./body-background.mp4" type="video/mp4">
    </video>

    <div class="strap">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="first-button"></div>
        <div class="button"></div>
    </div>



    <div class="watches">
        <div class="screen">
            <div class="battery-status">
                <meter value="100" min="0" max="100" low="15" high="60" optimum="80" class="battery"
                    style="width: 32px;"></meter>
                <span class="batteryText"></span>
            </div>


            <h2 class="time">00:00</h2>
            <h3 class="date">00.00.0000</h3>

            <button class="arrow">
                <div class="arrow-line"></div>
                <div class="arrow-line"></div>
            </button>
        </div>
        <div class="menu">
            <button class="open-btns open-timer">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 22h14" />
                    <path d="M5 2h14" />
                    <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" />
                    <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" />
                </svg>
            </button>

            <button class="open-btns open-stopwatch">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="13" r="8"></circle>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="13" x2="15" y2="15"></line>
                    <line x1="10" y1="2" x2="14" y2="2"></line>
                    <line x1="12" y1="2" x2="12" y2="5"></line>
                    <path d="M5 6L7 4"></path>
                </svg>
            </button>

            <button class="open-btns open-alarm-clock">
                <svg width="36" height="36" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                    <path d="M25 20 L17 14 L12 21" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M55 20 L63 14 L68 21" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <line x1="40" y1="14" x2="40" y2="9" stroke="white" stroke-width="4" stroke-linecap="round" />
                    <circle cx="40" cy="40" r="25" fill="none" stroke="white" stroke-width="4" />
                    <line x1="40" y1="40" x2="40" y2="26" stroke="white" stroke-width="4" stroke-linecap="round" />
                    <line x1="40" y1="40" x2="51" y2="46" stroke="white" stroke-width="4" stroke-linecap="round" />
                    <circle cx="40" cy="40" r="3" fill="white" />
                    <line x1="25" y1="61" x2="18" y2="69" stroke="white" stroke-width="4" stroke-linecap="round" />
                    <line x1="55" y1="61" x2="62" y2="69" stroke="white" stroke-width="4" stroke-linecap="round" />
                </svg>
            </button>

            <button class="open-btns open-weather">
                <svg width="36" height="36" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                    <g stroke="#FFD21F" stroke-width="2" stroke-linecap="round">
                        <line x1="29" y1="2" x2="29" y2="4" />
                        <line x1="29" y1="20" x2="29" y2="22" />
                        <line x1="19" y1="12" x2="21" y2="12" />
                        <line x1="37" y1="12" x2="39" y2="12" />
                        <line x1="22" y1="5" x2="23.5" y2="6.5" />
                        <line x1="35" y1="18" x2="36.5" y2="19.5" />
                        <line x1="35" y1="6.5" x2="36.5" y2="5" />
                    </g>

                    <circle cx="29" cy="12" r="7" fill="#FFD21F" />

                    <path d="M8 32
           C4.7 32 3 29.8 3 27
           C3 24.2 5.2 22 8 22
           C8.6 17.7 12.2 15 16.2 15
           C19.8 15 22.8 17.2 24 20.5
           C25.2 19.7 26.7 19.2 28.3 19.2
           C32.2 19.2 35 22 35 25.5
           C35 29.1 32.2 32 28.5 32
           Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round" />
                </svg>
            </button>

            <button class="open-btns open-calculator">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="2" width="16" height="20" rx="2" />
                    <line x1="8" y1="6" x2="16" y2="6" />
                    <line x1="8" y1="10" x2="8" y2="10" />
                    <line x1="12" y1="10" x2="12" y2="10" />
                    <line x1="16" y1="10" x2="16" y2="10" />
                    <line x1="8" y1="14" x2="8" y2="14" />
                    <line x1="12" y1="14" x2="12" y2="14" />
                    <line x1="16" y1="14" x2="16" y2="14" />
                    <line x1="8" y1="18" x2="8" y2="18" />
                    <line x1="12" y1="18" x2="12" y2="18" />
                    <line x1="16" y1="18" x2="16" y2="18" />
                </svg>
            </button>

            <button class="open-btns open-notes">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none"
                    stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>

            </button>
        </div>
        <div class="timer app">
            <button class="close-app">X</button>

            <div class="timer-wrap">
                <div class="hours-wrap">
                    <label class="timer-label">Години</label>
                    <input placeholder="00" maxlength="2" class="hours-inp timer-inp">
                </div>
                <div class="minuts-wrap">
                    <label class="timer-label">Хвилини</label>
                    <input placeholder="00" maxlength="2" class="minutes-inp timer-inp">
                </div>
                <div class="seconds-wrap">
                    <label class="timer-label">Секунди</label>
                    <input placeholder="00" maxlength="2" class="seconds-inp timer-inp">
                </div>
            </div>

            <button class="start-timer active">Start</button>
            <div class="timer-control-wrap">
                <button class="timer-stop">Stop</button>
                <button class="timer-pause">Pause</button>
            </div>
        </div>

        <div class="stopwatch app">
            <button class="close-app">X</button>

            <div class="stopwatch-wrap">
                <h3 class="stopwatch-text">00:00,00</h3>
                <div class="stopwatch-control">
                    <button class="ss-stopwatch">start</button>
                    <button class="clear-stopwatch">clear</button>
                </div>

            </div>

        </div>


        <div class="alarmClock app">
            <button class="close-app">X</button>

            <div class="alarm">
                <input type="time" class="alarm-inp" id="alarm-time">

                <div class="alarm-control">
                    <button id="set-alarm" class="alarm-btn">
                        Встановити
                    </button>

                    <button id="cancel-alarm" class="alarm-btn">
                        Скасувати
                    </button>
                </div>


                <p id="alarm-status"></p>

                <audio id="alarm-sound" loop>
                    <source src="./freesound_community-house_alarm-clock_loud-92419.mp3" type="audio/mpeg">
                </audio>
            </div>
        </div>



        <div class="weather app">
            <button class="close-app">X</button>

            <div class="weather-searchbar">
                <input placeholder="city" type="text" class="city-inp">
                <button class="search-city">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
                        <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>

            <div class="weather-wrap">

            </div>

        </div>

        <div class="calculator app">
            <button class="close-app">X</button>

            <h3 class="calculator-screen">0</h3>
            <div class="calculator-buttons-wrap">
                <button class="calculator-button calculator-button-1 calculator-clear-btn">C</button>
                <button class="calculator-button calculator-button-2 calculator-operator-btn">/</button>
                <button class="calculator-button calculator-button-3 calculator-operator-btn">*</button>
                <button class="calculator-button calculator-button-4 calculator-operator-btn">-</button>

                <button class="calculator-button calculator-button-5 calculator-number-btn">7</button>
                <button class="calculator-button calculator-button-5 calculator-number-btn">8</button>
                <button class="calculator-button calculator-button-6 calculator-number-btn">9</button>

                <button class="calculator-button calculator-button-8 calculator-number-btn">4</button>
                <button class="calculator-button calculator-button-9 calculator-number-btn">5</button>
                <button class="calculator-button calculator-button-10 calculator-number-btn">6</button>
                <button class="calculator-button calculator-button-11 calculator-operator-btn plus">+</button>

                <button class="calculator-button calculator-button-12 calculator-number-btn">1</button>
                <button class="calculator-button calculator-button-13 calculator-number-btn">2</button>
                <button class="calculator-button calculator-button-14 calculator-number-btn">3</button>

                <button class="calculator-button calculator-button-15 zero-btn calculator-number-btn">0</button>
                <button class="calculator-button calculator-button-16 calculator-number-btn">.</button>
                <button class="calculator-button calculator-button-17 calculator-equals-btn">=</button>
            </div>
        </div>

        <div class="notes app">
        <button class="close-app">X</button>
        <div class="notes-app-wrap">
            <button class="add-note">+</button>
            <div class="notes-wrap active">

            </div>
        </div>
        <div class="new-note-menu">
            <input required type="text" placeholder="Назва" class="new-note-name-inp">
            <textarea class="new-note-inp"></textarea>
            <div class="new-note-controll-wrap">
                <button class="add-new-note">Add</button>
                <button class="cancel-new-note">Cancel</button>
            </div>
        </div>
    </div>
    </div>

    

    <audio id="clock-music">
        <source src="./freesound_community-house_alarm-clock_loud-92419.mp3" type="audio/mpeg">
    </audio>



    <script type="module" src="script.js"></script>
</body>

</html>
